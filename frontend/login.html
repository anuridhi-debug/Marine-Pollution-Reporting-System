<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="marine-theme-page">

<div class="login-container">

    <div class="login-logo">
        <img src="images/marineguard-logo.png" alt="MarineGuard Logo">
    </div>

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >

        <!-- NEW: Role Selection -->
        <select id="loginRole" required>
            <option value="">Select Login Role</option>
            <option value="citizen">👤 Public Citizen</option>
            <option value="government">🏛️ Government Authority</option>
        </select>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
